<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker>
 <style>
  .bg{fill:#fff}.panel{fill:#fbfcfe;stroke:#8b98a7;stroke-width:2}.frame{fill:none;stroke:#243b53;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#526777;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wheel{fill:#e9eef3;stroke:#243b53;stroke-width:7}.drive{fill:#d9eaf7;stroke:#176b87;stroke-width:4}.seat{fill:#f6e7c8;stroke:#8a5a14;stroke-width:4}.cart{fill:#eef4e8;stroke:#49733c;stroke-width:4}.label{font:22px sans-serif;fill:#182b3a}.small{font:17px sans-serif;fill:#405466}.head{font: bold 30px sans-serif;fill:#172b3a}.sub{font:20px sans-serif;fill:#8b1e1e;font-weight:bold}.dim{stroke:#34495e;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.call{stroke:#657b8b;stroke-width:2;fill:none}.badge{fill:#8b1e1e}.white{fill:#fff;font:bold 19px sans-serif}
 </style>
</defs>
<rect class="bg" width="1600" height="1120"/>
<text x="60" y="58" class="head">OMER 移动服务车 · 总体布置 Rev A</text>
<text x="60" y="92" class="sub">概念工程图 / NOT FOR CONSTRUCTION / NO-RIDE</text>
<text x="60" y="125" class="small">三轮蝌蚪式候选：前双转向轮 · 后单驱动轮 · 坐姿脚踏 · 中心线拖车接口</text>

<!-- top view -->
<rect x="45" y="160" width="1510" height="435" rx="12" class="panel"/>
<text x="75" y="202" class="head">D-01 平面布置图（俯视，示意比例）</text>
<text x="1350" y="202" class="small">车辆前进方向 +X ↑</text>
<g transform="translate(0,0)">
 <!-- front wheels -->
 <rect x="370" y="245" width="68" height="150" rx="30" class="wheel"/>
 <rect x="770" y="245" width="68" height="150" rx="30" class="wheel"/>
 <text x="330" y="235" class="small">前左转向轮 FL</text><text x="760" y="235" class="small">前右转向轮 FR</text>
 <!-- steering bar -->
 <path d="M404 320 L465 350 L744 350 L804 320" class="thin"/>
 <path d="M465 350 L480 410 M744 350 L730 410" class="thin"/>
 <text x="500" y="390" class="small">转向连杆 / 机械限位（待工程设计）</text>
 <!-- crank -->
 <circle cx="604" cy="440" r="42" class="drive"/><path d="M604 440 L650 466 M604 440 L565 411" class="thin"/>
 <text x="520" y="500" class="small">脚踏曲柄（封闭防护）</text>
 <!-- seat -->
 <path d="M520 270 Q604 225 688 270 L700 335 Q604 370 508 335 Z" class="seat"/>
 <text x="565" y="300" class="label">座椅 / 操作员</text>
 <!-- drivetrain -->
 <path d="M604 440 L604 525" class="thin dash"/>
 <text x="620" y="525" class="small">封闭传动路径（细节待审）</text>
 <!-- rear drive wheel -->
 <circle cx="604" cy="545" r="34" class="wheel"/>
 <text x="660" y="552" class="small">后驱动轮 R</text>
 <!-- hitch cart -->
 <path d="M604 580 L604 615" class="thin"/>
 <rect x="480" y="615" width="248" height="78" rx="10" class="cart"/>
 <path d="M500 645 L708 645 M520 615 L520 693 M688 615 L688 693" class="thin"/>
 <text x="540" y="662" class="label">可拆卸购物车</text>
 <text x="750" y="634" class="small">中心线、低位牵引接口</text>
 <path d="M735 640 L630 596" class="call"/>
 <!-- dimensions -->
 <line x1="350" y1="220" x2="858" y2="220" class="dim"/>
 <text x="548" y="214" class="small">前轮外包络宽度 W = 待实测</text>
 <line x1="910" y1="245" x2="910" y2="578" class="dim"/>
 <text x="930" y="410" class="small">轴距 / 总长 = 待工程确定</text>
 <path d="M1000 270 L1130 270 L1130 330" class="call"/>
 <text x="1145" y="275" class="small">双手操作区</text>
 <text x="1145" y="302" class="small">转向与制动控制</text>
 <path d="M1000 435 L1130 435 L1130 475" class="call"/>
 <text x="1145" y="445" class="small">脚部封闭区</text>
 <text x="1145" y="472" class="small">运动时脚不触地</text>
</g>

<!-- side view -->
<rect x="45" y="620" width="930" height="420" rx="12" class="panel"/>
<text x="75" y="662" class="head">D-02 侧视布置图（示意）</text>
<line x1="100" y1="940" x2="900" y2="940" stroke="#667" stroke-width="3"/>
<circle cx="230" cy="900" r="42" class="wheel"/>
<circle cx="670" cy="900" r="42" class="wheel"/>
<path d="M230 900 L355 855 L520 855 L670 900" class="frame"/>
<path d="M370 835 Q445 780 520 825 L530 855 L365 855 Z" class="seat"/>
<path d="M400 875 L470 905 L525 875" class="thin"/>
<circle cx="470" cy="875" r="25" class="drive"/>
<path d="M470 875 L630 900" class="thin dash"/>
<path d="M670 900 L755 900" class="thin"/>
<rect x="755" y="845" width="150" height="75" rx="8" class="cart"/>
<circle cx="780" cy="925" r="13" class="wheel"/><circle cx="880" cy="925" r="13" class="wheel"/>
<text x="150" y="820" class="small">前轮</text><text x="640" y="820" class="small">后驱动轮</text>
<text x="360" y="755" class="small">坐姿座椅</text><text x="410" y="970" class="small">脚踏曲柄 / 传动护罩</text>
<text x="735" y="805" class="small">牵引接口</text><text x="790" y="875" class="small">购物车</text>
<line x1="230" y1="990" x2="670" y2="990" class="dim"/>
<text x="380" y="1020" class="small">轴距 WB = 待实测 / 待审查</text>
<text x="95" y="1015" class="small">地面基准</text>

<!-- front view -->
<rect x="1000" y="620" width="555" height="420" rx="12" class="panel"/>
<text x="1030" y="662" class="head">D-03 前视布置图</text>
<path d="M1110 875 L1440 875" class="frame"/>
<rect x="1085" y="815" width="55" height="130" rx="25" class="wheel"/>
<rect x="1410" y="815" width="55" height="130" rx="25" class="wheel"/>
<path d="M1275 750 L1275 820 M1195 785 L1355 785" class="thin"/>
<path d="M1220 815 Q1275 785 1330 815" class="seat"/>
<line x1="1110" y1="975" x2="1440" y2="975" class="dim"/>
<text x="1170" y="1008" class="small">前轮轮距 T = 待实测 / 待审查</text>
<text x="1100" y="785" class="small">前左轮</text><text x="1395" y="785" class="small">前右轮</text>

<!-- footer -->
<rect x="1010" y="170" width="535" height="410" rx="12" fill="#fff8f0" stroke="#b35c26" stroke-width="2"/>
<rect x="1040" y="195" width="190" height="34" rx="5" class="badge"/>
<text x="1055" y="219" class="white">重要安全声明</text>
<text x="1040" y="270" class="label">1. 本图只表达总体布局，不提供承载结构加工尺寸。</text>
<text x="1040" y="312" class="label">2. 车架、轮轴、转向和制动必须有额定资料。</text>
<text x="1040" y="354" class="label">3. 推进系统原创性须先经规则核验。</text>
<text x="1040" y="396" class="label">4. 无人静态/动态测试通过前禁止载人。</text>
<text x="1040" y="438" class="label">5. 青少年不得独自进行载人测试。</text>
<text x="1040" y="480" class="label">6. 门洞、轴距、轮距、座椅与脚踏尺寸均待实测。</text>
<text x="1040" y="535" class="small">图纸状态：Rev A · Concept · 仅供教练/工程顾问评审</text>
<text x="60" y="1080" class="small">项目：OM 2026–27 Long-Term Problem 1 | Drawing: Vehicle General Arrangement | Units: mm (TBD) | Status: NO-RIDE</text>
</svg>