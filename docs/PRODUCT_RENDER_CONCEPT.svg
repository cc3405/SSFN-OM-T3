<rect x="250" y="420" width="430" height="42" rx="8" fill="#d8e1e9" stroke="#61798b" stroke-width="3"/>
<rect x="280" y="285" width="24" height="140" fill="#5c819b"/><rect x="620" y="285" width="24" height="140" fill="#5c819b"/>
<rect x="280" y="285" width="364" height="22" rx="4" fill="#5c819b"/>
<rect x="304" y="320" width="316" height="95" rx="8" fill="#eaf0f5" stroke="#93a8b9" stroke-width="2"/>
<text x="462" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#294b64">主体框架 / 挡板</text>
<text x="462" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52677a">型材或轻质板材，尺寸待 CAD 校核</text>
<!-- arm base and links -->
<rect x="435" y="395" width="60" height="25" rx="7" fill="#df9d36"/>
<circle cx="465" cy="392" r="19" fill="#d88723" stroke="#8c571a" stroke-width="3"/>
<path d="M465 392 L425 320 L375 280" fill="none" stroke="#d88723" stroke-width="18" stroke-linecap="round"/>
<circle cx="425" cy="320" r="15" fill="#f0b85e" stroke="#8c571a" stroke-width="3"/>
<circle cx="375" cy="280" r="13" fill="#f0b85e" stroke="#8c571a" stroke-width="3"/>
<path d="M375 280 L350 262 M375 280 L394 258" fill="none" stroke="#526b7e" stroke-width="9" stroke-linecap="round"/>
<rect x="88" y="235" width="175" height="70" rx="12" fill="#fff6e8" stroke="#e4b66c" stroke-width="2"/>
<text x="175" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#7c4e12">抓取机械臂</text><text x="175" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7c4e12">候选方案，未实测</text>
<path d="M263 270 L330 270 L355 278" fill="none" stroke="#bd8128" stroke-width="2.5"/>
<!-- electronics -->
<rect x="490" y="435" width="110" height="28" rx="5" fill="#3b8a76"/><text x="545" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">ESP32-S3</text>
<rect x="340" y="435" width="105" height="28" rx="5" fill="#557fa3"/><text x="392" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">驱动/供电</text>
<!-- annotations -->
<text x="85" y="620" font-family="Arial,sans-serif" font-size="16" fill="#52677a">框架、挡板、孔位、轮距和重心均需按实际零件测量后定版。</text>
<rect x="940" y="145" width="405" height="520" rx="24" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
<text x="970" y="188" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24445f">B. 关键设计边界</text>
<circle cx="980" cy="235" r="6" fill="#3b8a76"/><text x="1000" y="242" font-family="Arial,sans-serif" font-size="18" fill="#294b64">ESP32-S3 作为控制器</text>
<circle cx="980" cy="285" r="6" fill="#3b8a76"/><text x="1000" y="292" font-family="Arial,sans-serif" font-size="18" fill="#294b64">机械臂负责商品抓取/装载</text>
<circle cx="980" cy="335" r="6" fill="#c17b23"/><text x="1000" y="342" font-family="Arial,sans-serif" font-size="18" fill="#294b64">舵机使用独立合适电源</text>
<circle cx="980" cy="385" r="6" fill="#b94c4c"/><text x="1000" y="392" font-family="Arial,sans-serif" font-size="18" fill="#294b64">独立卸载装置不得连接车辆</text>
<rect x="970" y="435" width="345" height="165" rx="14" fill="#fff4f1" stroke="#e8b6ae" stroke-width="2"/>
<text x="990" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#923d35">独立卸载装置（另行制作）</text>
<rect x="1010" y="495" width="260" height="55" rx="8" fill="#f3d4ce" stroke="#b96c61" stroke-width="2"/>
<path d="M1030 550 L1030 570 M1250 550 L1250 570" stroke="#b96c61" stroke-width="5"/><text x="1140" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#923d35">与车辆完全分离</text>
<text x="990" y="585" font-family="Arial,sans-serif" font-size="14" fill="#923d35">示意图，不代表已完成或通过测试</text>
<rect x="55" y="700" width="1290" height="140" rx="20" fill="#18324b"/>
<text x="85" y="745" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">后续工程化步骤</text>
<text x="85" y="785" font-family="Arial,sans-serif" font-size="18" fill="#e4edf5">1. 测量底盘与零件实物  →  2. 冻结框架/挡板尺寸  →  3. 建立可编辑 CAD  →  4. 装配与安全验证</text>
<text x="85" y="815" font-family="Arial,sans-serif" font-size="15" fill="#bdcddd">此 SVG 为重新绘制的概念示意图；不可直接用于切割、钻孔或打印加工。</text>
</svg>