<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8fc"/><stop offset="1" stop-color="#e5edf6"/></linearGradient><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fbfd"/><stop offset="1" stop-color="#b9c8d7"/></linearGradient></defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<text x="70" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18324b">OMER 购物服务车｜概念方案图</text>
<text x="72" y="110" font-family="Arial,sans-serif" font-size="19" fill="#52677a">当前项目方向示意 · 非尺寸工程图 · 机械结构和电气接口待实测确认</text>
<rect x="55" y="145" width="850" height="520" rx="24" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
<text x="85" y="188" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24445f">A. 车辆主体与商品抓取机构（示意）</text>
<!-- wheels -->
<rect x="220" y="470" width="490" height="105" rx="20" fill="#33485a"/>
<rect x="245" y="488" width="440" height="65" rx="12" fill="#526b7e"/>
<circle cx="285" cy="576" r="42" fill="#172a39"/><circle cx="285" cy="576" r="20" fill="#9fb0bd"/>
<circle cx="640" cy="576" r="42" fill="#172a39"/><circle cx="640" cy="576" r="20" fill="#9fb0bd"/>
