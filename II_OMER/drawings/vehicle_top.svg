<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#333" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="40" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold">LUNA-3 · 载人车总装俯视尺寸基线（非最终加工图）</text>
<text x="40" y="72" font-family="Arial,sans-serif" font-size="16" fill="#555">Group II · 单人手摇后驱 / 脚控前转向 · 单位 mm · 所有尺寸需人体工学与载荷验证</text>
<!-- chassis -->
<rect x="280" y="170" width="560" height="300" rx="16" fill="#eef3f7" stroke="#233746" stroke-width="8"/>
<line x1="300" y1="190" x2="820" y2="190" stroke="#233746" stroke-width="5"/>
<line x1="300" y1="450" x2="820" y2="450" stroke="#233746" stroke-width="5"/>
<!-- wheels -->
<rect x="240" y="200" width="45" height="90" rx="12" fill="#333"/><rect x="240" y="350" width="45" height="90" rx="12" fill="#333"/>
<rect x="840" y="200" width="45" height="90" rx="12" fill="#333"/><rect x="840" y="350" width="45" height="90" rx="12" fill="#333"/>
<text x="205" y="185" font-size="16" font-family="Arial">前轮</text><text x="890" y="185" font-size="16" font-family="Arial">后轮</text>
<!-- steering -->
<line x1="262" y1="245" x2="262" y2="395" stroke="#167c80" stroke-width="7"/>
<line x1="262" y1="320" x2="330" y2="320" stroke="#167c80" stroke-width="5"/>
<text x="40" y="305" font-size="18" font-family="Arial" fill="#167c80">脚控踏板 + 拉索/横拉杆</text>
<line x1="225" y1="312" x2="258" y2="312" stroke="#167c80" stroke-width="2" marker-end="url(#arr)"/>
<!-- seat -->
<rect x="440" y="250" width="220" height="140" rx="24" fill="#d9e6ef" stroke="#405b70" stroke-width="4"/>
<text x="550" y="315" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold">固定座椅</text>
<text x="550" y="345" text-anchor="middle" font-size="15" font-family="Arial">乘员全程由车辆支撑</text>
<!-- crank -->
<circle cx="550" cy="210" r="42" fill="#fff" stroke="#c47b22" stroke-width="6"/>
<line x1="550" y1="210" x2="610" y2="160" stroke="#c47b22" stroke-width="8"/>
<circle cx="610" cy="160" r="10" fill="#c47b22"/>
<text x="670" y="145" font-size="18" font-family="Arial" fill="#9b5c11">双手手摇曲柄</text>
<text x="670" y="168" font-size="15" font-family="Arial" fill="#9b5c11">链条 → 单向飞轮 → 后轴</text>
<line x1="650" y1="175" x2="605" y2="195" stroke="#9b5c11" stroke-width="2" marker-end="url(#arr)"/>
<!-- tow -->
<line x1="885" y1="320" x2="980" y2="320" stroke="#444" stroke-width="12"/>
<circle cx="900" cy="320" r="12" fill="#fff" stroke="#222" stroke-width="4"/>
<rect x="980" y="220" width="150" height="200" rx="8" fill="#f4f0e8" stroke="#7a6a4f" stroke-width="5"/>
<text x="1055" y="270" text-anchor="middle" font-size="18" font-family="Arial">可拆卸购物车</text>
<rect x="1000" y="290" width="110" height="100" fill="#fff" stroke="#7a6a4f" stroke-width="3"/>
<text x="1055" y="330" text-anchor="middle" font-size="15" font-family="Arial">三件商品</text>
<text x="1055" y="352" text-anchor="middle" font-size="13" font-family="Arial">承载篮筐</text>
<!-- dimensions -->
<line x1="280" y1="520" x2="840" y2="520" stroke="#333" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="560" y="550" text-anchor="middle" font-size="18" font-family="Arial">车架长度基线 1,250</text>
<line x1="180" y1="170" x2="180" y2="470" stroke="#333" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="160" y="330" text-anchor="middle" font-size="18" font-family="Arial" transform="rotate(-90 160 330)">总宽基线 620</text>
<rect x="40" y="600" width="1120" height="110" fill="#fff8e8" stroke="#c47b22" stroke-width="2"/>
<text x="60" y="635" font-size="18" font-family="Arial" font-weight="bold">安全/加工注记</text>
<text x="60" y="665" font-size="16" font-family="Arial">链条与夹点全封闭；主制动与驻车锁止独立；牵引销双剪切+二次保险；本图仅为布置示意，不得直接作为载人加工图。</text>
</svg>